version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: miband_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: miband_backend
    restart: unless-stopped
    # Permissões necessárias para acessar o hardware Bluetooth do Raspberry Pi
    privileged: true
    network_mode: "host" 
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      # Monta o DBus do host para comunicação BLE
      - /var/run/dbus:/var/run/dbus 
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: miband_frontend
    restart: unless-stopped
    ports:
      # O endereço (porta) do site é configurável pelo arquivo .env
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/app
    env_file:
      - .env

volumes:
  backend_data:

